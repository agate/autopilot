<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Assistant</title>
<!-- The local page (design 9.1). Served by lib/assistant/server.py with a Content-Security-Policy that allows only
     this file's own script and style and requests to this server. Card text is set as text only (textContent),
     never as HTML, and nothing is loaded from another host. -->
<style>
:root{
  --bg:#f3f4f7; --panel:#ffffff; --sunk:#eaecf0; --ink:#14171c; --ink-2:#394049; --muted:#646d7b;
  --line:#dde1e7; --line-2:#cbd0d8;
  --accent:#2949d6; --accent-ink:#ffffff; --accent-soft:#e7ebfd;
  --need:#b4530a; --need-soft:#fcefe2; --run:#0b7884; --run-soft:#ddf2f3;
  --plan:#6149c4; --plan-soft:#eeebfb; --done:#5d6674; --done-soft:#edeff2;
  --bad:#bb3127; --bad-soft:#fbe6e3; --good:#2c7a37;
  --f-ui:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;
  --f-mono:ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1014; --panel:#161920; --sunk:#1e222a; --ink:#e8eaee; --ink-2:#c3c8d1; --muted:#939bab;
    --line:#262b34; --line-2:#353b47;
    --accent:#8198ff; --accent-ink:#0d1020; --accent-soft:#1e2646;
    --need:#f0994b; --need-soft:#33230f; --run:#41c1cb; --run-soft:#0f2a2d;
    --plan:#a998ff; --plan-soft:#231e3c; --done:#8e97a5; --done-soft:#1d2128;
    --bad:#ff7d71; --bad-soft:#3b1815; --good:#72cd7e;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:var(--f-mono);font-size:12px}
.muted{color:var(--muted)}
.pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}

.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.brand small{font-family:var(--f-mono);font-size:10.5px;font-weight:500;color:var(--muted);padding:2px 6px;border:1px solid var(--line-2);border-radius:4px}
.quick{flex:1 1 240px;min-width:0;display:flex}
.quick input{width:100%;border:1px solid var(--line-2);background:var(--bg);border-radius:8px;padding:7px 12px}
.status{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;align-items:center}
.beat{display:inline-flex;align-items:center;gap:6px}
.beat::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}
.beat.late{color:var(--bad);font-weight:600}
.beat.late::before{background:var(--bad)}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .1)}
.banner{margin:8px 16px 0;padding:8px 12px;border-radius:8px;background:var(--bad-soft);color:var(--bad);font-size:13px;overflow-wrap:anywhere}

.local{flex:1;min-height:0;display:grid;grid-template-columns:210px minmax(290px,380px) minmax(0,1fr);gap:12px;padding:12px 16px}
.rail{display:flex;flex-direction:column;gap:2px;overflow:auto;min-height:0}
.rail h6{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 8px 6px;font-weight:650}
.rail h6:first-child{margin-top:4px}
.nav{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:6px;color:var(--ink-2);font-weight:500;text-decoration:none;min-width:0}
.nav:hover{background:var(--sunk)}
.nav[aria-current="true"]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.nav .n{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.nav .n.hot{color:var(--need);font-weight:600}
.nav-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail .empty{padding:4px 8px;font-size:12px;color:var(--muted)}

.pane{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:0;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.pane.wide{grid-column:2 / -1}
.pane-h{padding:14px 16px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:5px;flex:none}
.pane-h h2{margin:0;font-size:15px;font-weight:650;display:flex;align-items:center;gap:8px}
.pane-h p{margin:0;color:var(--muted);font-size:12.5px;max-width:70ch}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500}
.pane-b{overflow:auto;min-height:0;flex:1}
.note{padding:28px 16px;color:var(--muted);text-align:center}

.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.dot.needs{background:var(--need)}
.dot.running{background:var(--run);box-shadow:0 0 0 3px var(--run-soft)}
.dot.planned{border:2px solid var(--plan)}
.dot.done{background:var(--done);opacity:.65}
.chip{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px;background:var(--sunk);color:var(--ink-2);white-space:nowrap;line-height:1.6}
.chip.needs{background:var(--need-soft);color:var(--need)}
.chip.running{background:var(--run-soft);color:var(--run)}
.chip.planned{background:var(--plan-soft);color:var(--plan)}
.chip.done{background:var(--done-soft);color:var(--done)}
.chip.found{background:transparent;border:1px dashed var(--line-2);color:var(--muted)}
.pri{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line-2);border-radius:4px;padding:0 5px;line-height:1.6}
.pri.P0{color:var(--bad);border-color:var(--bad)} .pri.P1{color:var(--need);border-color:var(--need)}

.row{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.row:hover{background:var(--sunk)}
.row[aria-selected="true"]{background:var(--accent-soft)}
.row > .dot{margin-top:6px}
.row-main{flex:1;min-width:0}
.row-title{font-weight:560;line-height:1.3;overflow-wrap:anywhere}
.row-sub{font-size:12.5px;color:var(--ink-2);margin-top:3px;overflow-wrap:anywhere}
.row-meta{display:flex;gap:4px 8px;flex-wrap:wrap;align-items:center;margin-top:5px;font-size:12px;color:var(--muted)}
.row-meta .ask{color:var(--need);font-weight:600}

.det{padding:20px 24px 48px;display:flex;flex-direction:column;gap:20px;max-width:820px}
.det h1{font-size:21px;line-height:1.25;margin:0;font-weight:650;overflow-wrap:anywhere}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.plain{border:1px solid var(--line);border-left:3px solid var(--run);border-radius:10px;padding:12px 16px}
.plain dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:8px 0 0}
.plain dt{color:var(--muted);font-size:12.5px;font-weight:600;padding-top:2px;white-space:nowrap}
.plain dd{margin:0;line-height:1.55;overflow-wrap:anywhere}
.sec h3,.plain h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 9px;font-weight:650}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 18px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
blockquote{margin:8px 0 0;padding:10px 14px;border-left:3px solid var(--line-2);background:var(--bg);border-radius:0 8px 8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.btn{border:1px solid var(--line-2);background:var(--panel);padding:6px 12px;border-radius:7px;font-weight:560;font-size:13px;white-space:nowrap;text-decoration:none;color:inherit;display:inline-flex;align-items:center}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.warn{color:var(--bad);font-size:13px}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.log time{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);padding-top:1px}
.log .who{font-weight:600;margin-right:6px}
.qa{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:8px}
.qa-q{background:var(--sunk);border-radius:10px;padding:8px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.qa-a{border-left:2px solid var(--line-2);padding:4px 10px;margin-top:4px;font-size:13.5px;white-space:pre-wrap}
.qa-a.wait{color:var(--muted);font-style:italic}
.qa-form{display:flex;gap:8px;margin-top:6px}
.qa-form input{flex:1;min-width:0;border:1px solid var(--line-2);border-radius:7px;padding:7px 10px;background:var(--bg)}
.plainv ul{margin:0;padding-left:18px}
.plainv dl{margin:0}

table.grid{width:100%;border-collapse:collapse;font-size:13px}
table.grid th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650;padding:8px 12px;border-bottom:1px solid var(--line)}
table.grid td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
table.grid td.num{text-align:right;font-family:var(--f-mono);font-size:12px}
table.grid tr[aria-selected="true"] td{background:var(--accent-soft)}
.wf{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;max-width:440px;background:var(--bg)}
.wf-block{border:1px dashed var(--line-2);border-radius:6px;padding:8px 10px;font-size:12.5px;color:var(--ink-2);background:var(--panel);display:flex;justify-content:space-between;gap:8px}
.wf-block.first{border-style:solid;border-left:3px solid var(--run)}
.wf-btns{display:flex;flex-direction:column;gap:6px}
.wf-btns div{font-size:12.5px}
.wf-btns span.b{font-size:11.5px;padding:2px 8px;border-radius:5px;border:1px solid var(--line-2);background:var(--panel);margin-right:8px}
.role{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:4px}
.json{font-family:var(--f-mono);font-size:11.5px;background:var(--sunk);padding:12px;border-radius:8px;overflow-x:auto;margin:0;max-height:480px}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px;padding:16px}
.set{border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.set h3{font-size:13px;margin:0;font-weight:650}
/* Access: the badge, the compact usage and the red lines in the top bar; the cap card's answers.
   No value is cut: money wraps only at its spaces, never inside an amount, and nothing here has a fixed width. */
.access{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;min-width:0}
.access:empty{display:none}
.abadge{display:inline-flex;align-items:center;padding:1px 9px;border-radius:999px;background:var(--sunk);color:var(--ink);font-weight:600;text-decoration:none;overflow-wrap:anywhere}
.abadge.gw{background:var(--need-soft);color:var(--need)}
.uval,.kv dd.uval{overflow-wrap:normal;font-variant-numeric:tabular-nums;color:var(--ink-2);text-decoration:none}
.keyerr{color:var(--bad);font-weight:600;overflow-wrap:anywhere}
.keyerr a,.capnote a{color:inherit}
.capnote{color:var(--need);font-weight:600}
.capinfo{color:var(--muted);font-size:13px}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.btn.quiet{background:transparent;color:var(--muted);border-style:dashed}
.btn:disabled{cursor:default;opacity:.75}
.pbtn{gap:6px;white-space:normal;overflow-wrap:anywhere;text-align:left}
.pbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);opacity:1}
.choice{border:1px solid var(--line-2);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.choice p{margin:0;font-weight:600;font-size:13px}
.choice label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.choice select{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line-2);border-radius:6px;padding:5px 6px;max-width:100%}
.capans{border:1px solid var(--need);border-left-width:3px;border-radius:10px;padding:12px 16px}

@media (max-width:980px){
  body{display:block;height:auto}
  .local{display:flex;flex-direction:column}
  .rail{flex-direction:row;flex-wrap:wrap;overflow:visible}
  .rail h6{width:100%;margin:6px 8px 2px}
  .pane,.pane-b{overflow:visible}
  .det{padding:18px 16px 40px}
  .log li{grid-template-columns:110px minmax(0,1fr)}
}
</style>
</head>
<body>
<header id="top" class="top">
  <div class="brand"><span data-l="app.name">Assistant</span> <small id="mode-tag"></small></div>
  <div class="quick"><input id="search" type="search" autocomplete="off" data-l-placeholder="search.placeholder" data-l-aria="search.placeholder"></div>
  <div class="status">
    <span id="heartbeat" class="beat late" role="status"></span>
    <span id="running"></span>
    <span id="access" class="access"></span>
    <div id="lang-switch" class="seg" role="group" data-l-aria="lang.switch" hidden></div>
  </div>
</header>
<div id="banner" class="banner" role="alert" hidden></div>
<div class="local">
  <nav id="rail" class="rail">
    <h6 data-l="rail.lanes">Lanes</h6>
    <div id="rail-lanes"></div>
    <h6 data-l="rail.projects">Projects</h6>
    <div id="rail-projects"></div>
    <h6 data-l="rail.manage">Manage</h6>
    <div id="rail-manage"></div>
  </nav>

  <section id="list" class="pane">
    <div class="pane-h"><h2><span id="list-title"></span> <span id="list-count" class="count"></span></h2><p id="list-hint"></p></div>
    <div id="list-body" class="pane-b"></div>
  </section>
  <section id="card" class="pane">
    <div id="card-body" class="pane-b"></div>
  </section>

  <section id="sources" class="pane" hidden>
    <div class="pane-h"><h2 data-l="manage.sources">Sources</h2><p data-l="sources.hint"></p></div>
    <div id="sources-body" class="pane-b"></div>
  </section>
  <section id="source" class="pane" hidden>
    <div id="source-body" class="pane-b"></div>
  </section>

  <section id="templates" class="pane" hidden>
    <div class="pane-h"><h2 data-l="manage.templates">Templates</h2><p data-l="templates.hint"></p></div>
    <div id="templates-body" class="pane-b"></div>
  </section>
  <section id="template" class="pane" hidden>
    <div id="template-body" class="pane-b"></div>
  </section>

  <section id="settings" class="pane wide" hidden>
    <div class="pane-h"><h2 data-l="manage.settings">Settings</h2><p data-l="settings.hint"></p></div>
    <div id="settings-body" class="pane-b"></div>
  </section>
</div>

<script>
'use strict';
(function () {
  const LABELS = JSON.parse(document.getElementById('labels').textContent);
  const LANES = ['needs', 'running', 'planned', 'done'];
  const POLL_MS = 10000;       // design 12: the page polls /api/state every 10 seconds
  const LATE_SECONDS = 180;    // design 7.4: red after 3 minutes without a gate run
  const QUESTION_MAX = 2000;
  const SEARCH_MAX_CHARS = 500;  // the server's caps on a search: a longer one is refused (400), so it is never sent
  const SEARCH_MAX_WORDS = 50;
  const PANES = ['list', 'card', 'sources', 'source', 'templates', 'template', 'settings'];
  const S = {state: null, fetchedAt: 0, lang: null, route: {name: 'lane', arg: 'needs'}, list: {name: 'lane', arg: 'needs'},
             listData: null, cardId: null, choice: null, switchError: null, switching: false};

  const $ = id => document.getElementById(id);

  // --- labels: one table per language; a code like zh-Hans uses zh; others fall back to en ----------------------
  function table(lang) { return LABELS[lang] || LABELS[String(lang).split('-')[0]] || LABELS.en; }
  function L(key, vars) {
    let s = table(S.lang)[key];
    if (s === undefined) s = LABELS.en[key];
    if (s === undefined) s = key;
    if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] === undefined ? m : String(vars[k])));
    return s;
  }

  // --- elements: built with createElement and textContent only --------------------------------------------------
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = String(v);
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : String(v));
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid === null || kid === undefined || kid === false) continue;
      el.append(kid instanceof Node ? kid : String(kid));
    }
    return el;
  }
  function webLink(url) { return typeof url === 'string' && /^https?:\/\//i.test(url) ? url : null; }
  function route(...parts) { return '#/' + parts.map(p => encodeURIComponent(p)).join('/'); }
  function text(v) { return v === null || v === undefined ? '' : String(v); }

  // --- time -----------------------------------------------------------------------------------------------------
  function parseStamp(s) { const t = typeof s === 'string' ? Date.parse(s) : NaN; return isNaN(t) ? null : t; }
  function ago(seconds) {
    if (seconds === null || seconds === undefined || isNaN(seconds)) return '';
    if (seconds < 0) return L('time.future');
    if (seconds < 5) return L('time.just');
    if (seconds < 60) return L('time.s', {n: Math.floor(seconds)});
    if (seconds < 3600) return L('time.m', {n: Math.floor(seconds / 60)});
    if (seconds < 86400) return L('time.h', {n: Math.floor(seconds / 3600)});
    return L('time.d', {n: Math.floor(seconds / 86400)});
  }
  function when(stamp) {
    const t = parseStamp(stamp);
    if (t === null) return text(stamp);
    const d = new Date(t), p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  function timeEl(stamp) {
    const t = parseStamp(stamp);
    return h('time', {datetime: text(stamp), title: text(stamp), text: t === null ? text(stamp) : when(stamp)});
  }

  // --- data -----------------------------------------------------------------------------------------------------
  async function api(path, opts) {
    let r;
    try {
      r = await fetch(path, Object.assign({cache: 'no-store', credentials: 'same-origin'}, opts || {}));
    } catch (e) {
      // The browser's own words for a dead connection are English only; say it in the page's language instead.
      const err = new Error(L('error.offline'));
      err.offline = true;
      throw err;
    }
    let body = null;
    try { body = await r.json(); } catch (e) { body = null; }
    if (!r.ok) {
      const err = new Error((body && body.error) || (r.status + ' ' + r.statusText));
      err.status = r.status;
      throw err;
    }
    return body;
  }
  function showError(e) {
    const b = $('banner');
    if (!e) { b.hidden = true; b.replaceChildren(); return; }
    b.replaceChildren(L('error.load') + ' ' + (e && e.message ? e.message : String(e)));
    b.hidden = false;
  }
  function languages() { return (S.state && S.state.languages) || ['en']; }
  function inLang(obj) {
    // Plain words and other per-language text: the chosen language only, never another one on the same screen.
    if (obj && typeof obj === 'object' && typeof obj[S.lang] === 'string') return obj[S.lang];
    return null;
  }
  function blankText(t) {
    // A title slot with no words: not a text, or only what Python's str.strip() or trim() removes (cards.blank).
    return typeof t !== 'string' || !t.replace(/[\u001c-\u001f\u0085\ufeff]/g, '').trim();
  }
  function titleIn(t, fallback) {
    // A card's title in the page's language: its slot for that language, else the primary language's (never both
    // on one screen), else its first non-blank slot in sorted key order (cards.title_for's third step), else one
    // text (a stored card's same words in every language, or an older reply), else the fallback (the untitled
    // label unless given).
    if (t && typeof t === 'object' && !Array.isArray(t)) {
      const primary = (S.state && S.state.primary_language) || languages()[0];
      for (const lang of [S.lang, primary, ...Object.keys(t).sort()]) {
        if (!blankText(t[lang])) return t[lang];
      }
    } else if (!blankText(t)) return t;
    return fallback === undefined ? L('card.untitled') : fallback;
  }

  // --- language -------------------------------------------------------------------------------------------------
  function pickLang() {
    const langs = languages();
    let saved = null;
    try { saved = localStorage.getItem('ap2-local-lang'); } catch (e) { saved = null; }
    // The choice made with the switch is kept in this browser; a language no longer configured falls back.
    if (S.lang === null || !langs.includes(S.lang)) S.lang = langs.includes(saved) ? saved : langs[0];
  }
  function setLang(lang) {
    S.lang = lang;
    try { localStorage.setItem('ap2-local-lang', lang); } catch (e) { /* a private window */ }
    drawAll();
    show();
  }
  function drawStatic() {
    document.documentElement.lang = S.lang || 'en';
    document.title = L('app.name');
    for (const el of document.querySelectorAll('[data-l]')) el.textContent = L(el.getAttribute('data-l'));
    for (const el of document.querySelectorAll('[data-l-placeholder]')) el.setAttribute('placeholder', L(el.getAttribute('data-l-placeholder')));
    for (const el of document.querySelectorAll('[data-l-aria]')) el.setAttribute('aria-label', L(el.getAttribute('data-l-aria')));
  }

  // --- top bar and rail -----------------------------------------------------------------------------------------
  function drawTop() {
    const st = S.state;
    if (!st) return;
    $('mode-tag').textContent = L('mode.' + (st.mode === 'live' ? 'live' : 'shadow'));
    drawBeat();
    $('running').textContent = L('running.count', {n: st.running});
    drawAccess();
    const sw = $('lang-switch');
    sw.replaceChildren();
    sw.hidden = !st.secondary_language;
    if (st.secondary_language) {
      for (const lang of st.languages) {
        sw.append(h('button', {type: 'button', 'aria-pressed': String(lang === S.lang), text: lang.toUpperCase(),
                              onclick: () => setLang(lang)}));
      }
    }
  }
  function drawBeat() {
    const st = S.state, el = $('heartbeat');
    if (!st) return;
    const hb = st.heartbeat || {};
    let age = hb.age_seconds, late = !!hb.late;
    if (typeof age === 'number' && !hb.error) {
      age += Math.floor((Date.now() - S.fetchedAt) / 1000);
      late = late || age >= LATE_SECONDS;
    }
    if (hb.error) el.textContent = L('beat.error');
    else if (hb.last_run_at === null || hb.last_run_at === undefined) el.textContent = L('beat.never');
    else el.textContent = L('beat.last', {ago: ago(age)});
    el.classList.toggle('late', late);
    el.title = hb.error ? hb.error : late ? L('beat.late') : text(hb.last_run_at);
  }

  // --- access: the profile badge, the usage by mode, the key and profile errors, the cap card -------------------
  function money(x) {
    // Dollars with two decimals and thousands separators, in full: `$2,300.00`, never cut. A total the server
    // clamped (the largest number) is a marker, not a 309-digit amount that looks real.
    if (typeof x !== 'number' || !isFinite(x)) return '$?';
    if (x === Number.MAX_VALUE) return L('usage.too_large');
    return '$' + x.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  }
  function badge(a) {
    // How workers are paid: the subscription, or a gateway with its label, model and effort; page sessions always
    // run on the subscription. null when the active profile cannot be loaded (its error says so).
    if (!a || !a.profile) return null;
    const p = a.profile;
    if (p.mode !== 'gateway') return {cls: 'abadge', text: L('access.subscription'), detail: null, pages: null};
    const detail = [p.model, p.effort].filter(x => typeof x === 'string' && x).join(' · ');
    return {cls: 'abadge gw', text: L('access.workers', {label: p.label || p.name}), detail: detail || null,
            pages: L('access.page_sessions')};
  }
  function windowName(w) {
    // The two window kinds Claude Code names today get a label; any other kind shows as it is.
    const kind = w && w.kind;
    if (kind === 'five_hour' || kind === 'seven_day') return L('usage.' + kind);
    return text(kind);
  }
  function topWindow(u) {
    const ws = u && Array.isArray(u.windows) ? u.windows.filter(w => w && typeof w.percent === 'number') : [];
    return ws.length ? ws.reduce((a, b) => (b.percent > a.percent ? b : a)) : null;
  }
  function usageShort(u) {
    // The top bar's usage: on the subscription the highest window; on a gateway today's dollars and today's limit.
    if (!u) return '';
    if (u.mode === 'gateway') {
      const g = u.gateway || {};
      if (typeof g.today !== 'number') return L('usage.not_today');
      if (typeof g.limit !== 'number') return L('usage.today_only', {spent: money(g.today)});
      return L('usage.today_short', {spent: money(g.today), limit: money(g.limit)});
    }
    if (u.mode !== 'subscription') return '';
    const w = topWindow(u);
    return w ? L('usage.window_short', {kind: windowName(w), pct: Math.round(w.percent)}) : '';
  }
  function accessAlerts(a) {
    // The top bar's lines after the usage: a profile or key that does not work (red, a label in the page's language

      button.disabled = true;
      try {
        await api('/api/cards/' + encodeURIComponent(card.id) + '/questions',
                  {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({text: value})});
        input.value = '';
        // Only while the page still shows this card: a reply after the reader moved on must not draw it there.
        if (S.route && S.route.name === 'card' && S.route.arg === card.id) await loadCard(card.id);
      } catch (e) {
        // A refusal's reason is the store's own English words: a label in the page's language, the reason under it.
        if (e.status === 409) status.replaceChildren(h('p', {text: L('q.refused')}), h('p', {class: 'mono', text: e.message}));
        else status.replaceChildren(h('p', {text: L('q.failed') + ' ' + e.message}));
        status.hidden = false;
      } finally { button.disabled = false; }
    };
    const button = h('button', {class: 'btn primary', type: 'button', text: L('q.send'), onclick: send});
    input.addEventListener('keydown', e => {
      if (e.isComposing || e.keyCode === 229) return;  // the Enter that ends an IME composition
      if (e.key === 'Enter') { e.preventDefault(); send(); }
    });
    return section('questions', list, h('div', {class: 'qa-form'}, input, button), status);
  }
  function activitySection(audit) {
    const items = Array.isArray(audit) ? audit : [];
    return section('activity', h('ul', {class: 'log'}, items.map(a => h('li', {},
      timeEl(a && a.at),
      h('div', {}, h('span', {class: 'who', text: text(a && a.by)}), h('span', {text: text(a && a.did)}),
        a && a.restore ? h('span', {class: 'muted mono', text: '  · ' + L('act.restore', {id: a.restore})}) : null)))));
  }
  function rowsSection(block, rows) {
    return section(block, rows && rows.length ? rows.map(rowEl) : h('p', {class: 'muted', text: L('none')}));
  }
  function drawCard(d) {
    const box = $('card-body');
    box.replaceChildren();
    if (!d) { box.append(h('div', {class: 'note', text: L('card.empty')})); return; }
    const c = d.card;
    const lane = LANES.includes(c.lane) ? c.lane : 'done';
    const det = h('article', {class: 'det'});
    det.append(h('div', {class: 'chips'},
      h('span', {class: 'chip ' + lane, text: L('lane.' + lane)}),
      h('span', {class: 'chip mono', text: text(c.kind)}),
      h('span', {class: 'pri ' + text(c.pri), text: text(c.pri)}),
      c.feed ? h('span', {class: 'chip', text: L('chip.from', {feed: c.feed})}) : null,
      c.origin === 'found' ? h('span', {class: 'chip found', text: L('chip.found')}) : null,
      c.ask && c.ask.type ? h('span', {class: 'chip needs', text: L('ask.' + c.ask.type)}) : null));
    det.append(h('h1', {text: titleIn(c.title)}));
    const plain = c.plain || {};
    det.append(h('section', {class: 'plain'}, h('h3', {text: L('plain.title')}),
      h('dl', {}, ['what', 'where', 'do'].map(line => {
        const t = inLang(plain[line]);
        return [h('dt', {text: L('plain.' + line)}), h('dd', {class: t === null ? 'muted' : null, text: t === null ? L('plain.missing') : t})];
      }))));
    if (d.template_error) det.append(h('div', {class: 'warn'}, h('p', {text: L('card.template_error')}), h('p', {class: 'mono', text: d.template_error})));
    const area = capArea(c);  // the cap card's answer buttons, or the note of its answer
    if (area) det.append(area);
    for (const block of d.view) {
      if (block === 'source_block') { if (d.source_block) det.append(sourceSection(d.source_block)); }
      else if (block === 'children') det.append(rowsSection('children', d.children));
      else if (block === 'links') det.append(rowsSection('links', d.links));
      else if (block === 'questions') det.append(questionsSection(c));
      else if (block === 'activity') det.append(activitySection(d.activity));
      else if (Object.prototype.hasOwnProperty.call(c, block) && c[block] !== null && c[block] !== undefined) {
        det.append(section(block, h('div', {class: 'plainv'}, plainValue(c[block]))));
      }
    }
    box.append(det);
  }
  async function loadCard(id) {
    S.cardId = id;
    try {
      const d = await api('/api/cards/' + encodeURIComponent(id));
      if (S.cardId !== id) return;
      showError(null);
      drawCard(d);
    } catch (e) {
      if (S.cardId !== id) return;
      $('card-body').replaceChildren(h('div', {class: 'note', text: e.status === 404 ? L('card.none') : L('error.load') + ' ' + e.message}));
    }
    drawList();
  }

  // --- Sources, Templates, Settings -----------------------------------------------------------------------------
  function grid(heads, rows) {
    return h('table', {class: 'grid'}, h('thead', {}, h('tr', {}, heads.map(x => h('th', {text: x})))),
      h('tbody', {}, rows));
  }
  function originLabel(origin) {
    if (origin === 'builtin' || origin === 'built-in') return L('origin.builtin');
    if (origin === 'user') return L('origin.user');
    const ext = /^user, extends (.+)$/.exec(String(origin || ''));
    if (ext) return L('origin.extends', {name: ext[1]});
    return text(origin);
  }
  async function drawSources(name) {
    const body = $('sources-body'), detail = $('source-body');
    let list;
    try { list = await api('/api/sources'); showError(null); } catch (e) { showError(e); list = []; }
    body.replaceChildren(grid([L('col.name'), L('col.brings'), L('col.via'), L('col.every'), L('col.cards')],
      list.map(s => h('tr', {'aria-selected': s.source === name ? 'true' : null},
        h('td', {}, h('a', {href: route('sources', s.source), text: s.source})),
        h('td', {class: 'mono', text: text(s.brings)}), h('td', {class: 'mono', text: text(s.via)}),
        h('td', {class: 'mono', text: text(s.every)}), h('td', {class: 'num', text: text(s.cards)})))));
    detail.replaceChildren();
    if (!name) { detail.append(h('div', {class: 'note', text: L('sources.pick')})); return; }
    try {
      const s = await api('/api/sources/' + encodeURIComponent(name));
      detail.append(h('div', {class: 'det'}, h('h1', {class: 'mono', text: s.source}),
        h('dl', {class: 'kv'},
          h('dt', {text: L('col.brings')}), h('dd', {class: 'mono', text: text(s.brings)}),
          h('dt', {text: L('col.via')}), h('dd', {class: 'mono', text: text(s.via)}),
          h('dt', {text: L('col.fill')}), h('dd', {class: 'mono', text: text(s.fill)}),
          h('dt', {text: L('col.every')}), h('dd', {class: 'mono', text: text(s.every)}),
          h('dt', {text: L('col.origin')}), h('dd', {text: originLabel(s.origin)}),
          h('dt', {text: L('col.cards')}), h('dd', {text: text(s.cards)}),
          h('dt', {text: L('col.files')}), h('dd', {}, (s.files || []).map(f => h('div', {class: 'mono', text: f})))),
        h('section', {class: 'sec'}, h('h3', {text: L('sources.data')}), h('pre', {class: 'json', text: JSON.stringify(s.data, null, 2)}))));
    } catch (e) { detail.append(h('div', {class: 'note', text: L('error.load') + ' ' + e.message})); }
  }
  function buttonText(b) {
    if (b.lane) return L('btn.lane', {lane: L('lane.' + b.lane)});
    if (b.restore) return L('btn.restore');
    if (b.child) return L('btn.child', {kind: b.child});
    return '';
  }
  async function drawTemplates(kind) {
    const body = $('templates-body'), detail = $('template-body');
    let list;
    try { list = await api('/api/templates'); showError(null); } catch (e) { showError(e); list = []; }
    body.replaceChildren(grid([L('col.kind'), L('col.title'), L('col.origin')],
      list.map(t => h('tr', {'aria-selected': t.kind === kind ? 'true' : null},
        h('td', {}, h('a', {class: 'mono', href: route('templates', t.kind), text: t.kind})),
        h('td', {text: text(t.title)}), h('td', {text: originLabel(t.origin)})))));
    detail.replaceChildren();
    if (!kind) { detail.append(h('div', {class: 'note', text: L('templates.pick')})); return; }
    try {
      const t = await api('/api/templates/' + encodeURIComponent(kind));
      const data = t.template || {};
      const view = Array.isArray(data.view) ? data.view : [];
      const buttons = Array.isArray(data.buttons) ? data.buttons : [];
      detail.append(h('div', {class: 'det'},
        h('h1', {}, h('span', {class: 'mono', text: t.kind}), data.title ? ' · ' + data.title : ''),
        data.description ? h('p', {class: 'pre', text: data.description}) : null,
        h('dl', {class: 'kv'},
          h('dt', {text: L('col.origin')}), h('dd', {}, originLabel(t.origin), t.replaces_builtin ? ' · ' + L('template.replaces') : ''),
          h('dt', {text: L('col.file')}), h('dd', {class: 'mono', text: text(t.file)}),
          h('dt', {text: L('col.cards')}), h('dd', {text: L('template.cards', {n: t.cards})})),
        h('section', {class: 'sec'}, h('h3', {text: L('template.view')}),
          h('div', {class: 'wf'}, h('div', {class: 'wf-block first'}, h('span', {text: L('plain.title')})),
            view.map(b => h('div', {class: 'wf-block'}, h('span', {text: L('block.' + b)}), h('span', {class: 'mono muted', text: b}))))),
        h('section', {class: 'sec'}, h('h3', {text: L('template.buttons')}),
          h('div', {class: 'wf-btns'}, buttons.length ? buttons.map(b => h('div', {}, h('span', {class: 'b', text: text(b.label)}), h('span', {class: 'muted', text: buttonText(b)})))
            : h('p', {class: 'muted', text: L('none')})),
          h('p', {class: 'muted', text: L('template.buttons_later')})),
        h('section', {class: 'sec'}, h('h3', {text: L('template.roles')}),
          (t.roles || []).map(r => h('div', {class: 'role'},
            h('div', {}, h('strong', {class: 'mono', text: text(r.role)}), h('span', {class: 'muted', text: '  · ' + L('template.floor') + ': ' + text(r.floor)})),
            r.when ? h('div', {class: 'muted', text: L('template.when') + ': ' + r.when}) : null,
            h('div', {class: 'mono', text: L('template.tools') + ': ' + (r.tools || []).join(', ')}),
            h('p', {class: 'pre', text: text(r.brief)}))))));
    } catch (e) { detail.append(h('div', {class: 'note', text: L('error.load') + ' ' + e.message})); }
  }
  function size(n) {
    if (typeof n !== 'number') return '';
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let i = 0;
    while (n >= 1024 && i < units.length - 1) { n /= 1024; i += 1; }
    return (i === 0 ? String(n) : n.toFixed(1)) + ' ' + units[i];
  }
  async function drawSettings() {
    const body = $('settings-body');
    let s;
    try { s = await api('/api/settings'); showError(null); } catch (e) { showError(e); body.replaceChildren(); return; }
    const cfg = s.config || {};
    const disk = s.disk || {};
    const total = Object.values(disk).reduce((a, b) => a + (typeof b === 'number' ? b : 0), 0);
    const unset = v => (v === null || v === undefined || v === '' ? L('settings.unset') : String(v));
    body.replaceChildren(h('div', {class: 'sets'}, accessSet(),
      h('div', {class: 'set'}, h('h3', {text: L('settings.config')}),
        h('dl', {class: 'kv'},
          h('dt', {text: L('settings.mode')}), h('dd', {class: 'mono', text: unset(cfg.mode)}),
          h('dt', {text: L('settings.primary')}), h('dd', {class: 'mono', text: unset(cfg.primary_language)}),
          h('dt', {text: L('settings.secondary')}), h('dd', {class: 'mono', text: unset(cfg.secondary_language)}),
          h('dt', {text: L('settings.keep')}), h('dd', {class: 'mono', text: unset(cfg.keep_transcripts)}),
          h('dt', {text: L('settings.data_dir')}), h('dd', {class: 'mono', text: text(s.data_dir)}),
          h('dt', {text: L('settings.url')}), h('dd', {class: 'mono', text: text(s.url)}))),
      h('div', {class: 'set'}, h('h3', {text: L('settings.disk')}),
        grid([L('col.name'), L('col.size')],
          Object.keys(disk).map(k => h('tr', {}, h('td', {class: 'mono', text: k}), h('td', {class: 'num', text: size(disk[k])})))
            .concat([h('tr', {}, h('td', {}, h('strong', {text: L('settings.total')})), h('td', {class: 'num', text: size(total)}))])))));
  }

  // --- routing: #/lane/<lane>, #/search/<q>, #/project/<id>, #/card/<id>, #/sources[/<name>],
  //     #/templates[/<kind>], #/settings ------------------------------------------------------------------------
  function parseRoute() {
    const raw = location.hash.replace(/^#\/?/, '');
    const parts = raw.split('/').map(p => { try { return decodeURIComponent(p); } catch (e) { return p; } });
    const name = parts[0], arg = parts.slice(1).join('/');
    if (name === 'lane' && LANES.includes(arg)) return {name, arg};
    if ((name === 'search' || name === 'project' || name === 'card') && arg) return {name, arg};
    if (name === 'sources' || name === 'templates') return {name, arg: arg || null};
    if (name === 'settings') return {name, arg: null};
    return {name: 'lane', arg: 'needs'};
  }
  function panes(...visible) { for (const id of PANES) $(id).hidden = !visible.includes(id); }
  function drawAll() { drawStatic(); drawTop(); drawRail(); drawList(); }
  async function show() {
    const r = S.route = parseRoute();
    // A cap note is for the card it was answered on, right after the answer: leaving that card drops it, so a
    // later visit draws no stale note (a lane or Settings, Sources, Templates never reach drawCard's check).
    if (S.capNote && !(r.name === 'card' && r.arg === S.capNote.id)) S.capNote = null;
    // The choice box and a switch's error are for Settings while it stays open: leaving it drops them.
    if (r.name !== 'settings') { S.choice = null; S.switchError = null; }
    drawRail();
    if (r.name === 'lane' || r.name === 'search' || r.name === 'project' || r.name === 'card') {
      panes('list', 'card');
      if (r.name !== 'card') {
        S.list = r;
        S.cardId = null;
        drawCard(null);
        if (r.name === 'search') $('search').value = r.arg;
      }
      await loadList();
      if (r.name === 'card') await loadCard(r.arg);
    } else if (r.name === 'sources') { panes('sources', 'source'); await drawSources(r.arg); }
    else if (r.name === 'templates') { panes('templates', 'template'); await drawTemplates(r.arg); }
    else { panes('settings'); await drawSettings(); }
  }

  async function poll() {
    try {
      S.state = await api('/api/state');
      S.fetchedAt = Date.now();
      pickLang();
      showError(null);
    } catch (e) { showError(e); }
    drawStatic();
    drawTop();
    drawRail();
  }
  function capKey(st) {
    // What the open card's cap buttons depend on: today's cap card, its state and the raise.
    const c = st && st.access && st.access.cap;
    return c ? [c.card, c.card_id, c.raise_pct].join('|') : '';
  }
  async function tick() {
    // Every 10 seconds: the heartbeat, the counts and the open list, without a reload.
    const cap = capKey(S.state), capId = st => st && st.access && st.access.cap && st.access.cap.card_id;
    const before = capId(S.state);
    await poll();
    const r = S.route;
    if (r.name === 'lane' || r.name === 'search' || r.name === 'project' || r.name === 'card') await loadList();
    // The cap card opened again (or was answered elsewhere): redraw it when it is the card on screen, so its
    // buttons match. Any other card is left alone (a redraw would wipe a question being typed).
    // Only when the route is still the one this tick started on: a click while the list loaded moved on.
    if (S.route === r && r.name === 'card' && capKey(S.state) !== cap && (r.arg === before || r.arg === capId(S.state))) {
      await loadCard(r.arg);
    }
    // Settings: its Access box is drawn from the state, so redraw it with the new one (the top bar's links to
    // Settings land on the screen already open and draw nothing). Not while a choice box is open: a redraw would
    // close a drop-down list under the user's pointer; the box's own buttons redraw it when it closes.
    if (r.name === 'settings' && !S.choice) redrawAccess();
  }

  $('search').addEventListener('keydown', e => {
    if (e.isComposing || e.keyCode === 229) return;  // the Enter that ends an IME composition
    if (e.key !== 'Enter') return;
    const q = $('search').value.trim();
    location.hash = q ? route('search', q) : route('lane', 'needs');
  });
  window.addEventListener('hashchange', show);
  (async () => {
    await poll();
    await show();
    setInterval(tick, POLL_MS);
    setInterval(drawBeat, 1000);
  })();
})();
</script>
</body>
</html>
