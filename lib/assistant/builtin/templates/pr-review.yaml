# Built-in template: someone asked the user to review a pull request (design 6.2).
kind: pr-review
title: PR review
description: A review request that reviews itself. You open it to a verdict, then review on GitHub yourself.
source: any
view: [source_block, verdict, findings, draft, activity]
buttons:
  - id: reviewed
    label: I reviewed it
    lane: done
  - id: later
    label: Later
    lane: planned
  - id: undo
    label: Undo
    restore: last
roles:
  - role: reviewer-angle
    brief: "Review the pull request in {title}, read-only: the requirement, the code around the change, and CI at the head. Check each finding against the code. Lead with a verdict: approve, changes or question. Post nothing."
