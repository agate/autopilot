<title>Autopilot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Inbox layout: what waits on you comes first, as cards with answer buttons; status lives in one compact
   side panel (desktop) or its own tab (phone). */
:root {
  --bg: #f6f2ea; --surface: #fffdf8; --surface-2: #efe9de; --ink: #29251f; --ink-2: #4b443a; --muted: #6e6558;
  --line: #e4dccd; --line-strong: #cfc4b1;
  --accent: #2f5d8c; --accent-ink: #ffffff; --accent-soft: #e4ecf5; --accent-line: #a9c0da;
  --ok: #2b7a4b; --ok-soft: #e1efe5; --warn: #8f5600; --warn-soft: #f7ead3; --crit: #b0271f; --crit-soft: #f7e0dc;
  --gate: #6a46a8; --gate-soft: #ede6f7;
  --shadow: 0 1px 2px rgba(70, 52, 24, .05), 0 6px 20px rgba(70, 52, 24, .06);
  --f-body: "Figtree", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  --r: 16px; --r-sm: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #171512; --surface: #211e1a; --surface-2: #2b2722; --ink: #eee7da; --ink-2: #d2c9b9; --muted: #a59c8c;
  --line: #36312a; --line-strong: #4b453b;
  --accent: #93b8df; --accent-ink: #0f1d2b; --accent-soft: #1e2a37; --accent-line: #3d5670;
  --ok: #7fcf9c; --ok-soft: #1b2d21; --warn: #e5b566; --warn-soft: #33291a; --crit: #ff9b90; --crit-soft: #3a201d;
  --gate: #c5a9f1; --gate-soft: #2b2338;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #171512; --surface: #211e1a; --surface-2: #2b2722; --ink: #eee7da; --ink-2: #d2c9b9; --muted: #a59c8c;
  --line: #36312a; --line-strong: #4b453b;
  --accent: #93b8df; --accent-ink: #0f1d2b; --accent-soft: #1e2a37; --accent-line: #3d5670;
  --ok: #7fcf9c; --ok-soft: #1b2d21; --warn: #e5b566; --warn-soft: #33291a; --crit: #ff9b90; --crit-soft: #3a201d;
  --gate: #c5a9f1; --gate-soft: #2b2338;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
html { -webkit-text-size-adjust: 100% }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/1.55 var(--f-body) }
html[lang^="zh"] body { line-height: 1.65 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg) }
h1, h2, h3 { margin: 0 }
h1, h2 { text-wrap: balance }
h3 { text-wrap: pretty }
h2 { font-size: 16px; font-weight: 700; line-height: 1.35 }
h3 { font-size: 15px; font-weight: 650; line-height: 1.45 }
a { color: var(--accent) }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: .92em }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
button, input { font: inherit; color: inherit }
button { cursor: pointer }
button:disabled { cursor: default }

.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

/* Header */
/* Header: phone = brand + language, then the autopilot switch. Desktop = one row.
   Run state lives in the status panel only (the status tab shows a mark when something is wrong). */
header.top { background: var(--bg); padding-top: env(safe-area-inset-top, 0px) }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "brand lang" "filters filters";
  align-items: center; gap: 6px 12px; padding-block: 8px 10px }
.brand { grid-area: brand; display: flex; align-items: center; gap: 8px; min-width: 0 }
.brand .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); flex: none }
h1 { font-size: 16px; font-weight: 700; letter-spacing: -.01em }
.lang { grid-area: lang; display: inline-flex; align-items: center; gap: 3px; min-height: 30px; padding: 0 9px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); font: 500 12.5px/1 var(--f-body); color: var(--muted) }
.lang .on { color: var(--ink); font-weight: 700 }
.lang .sl { color: var(--line-strong) }
.lang:hover { border-color: var(--accent) }
.filters { grid-area: filters; justify-self: start; display: inline-flex; gap: 2px; padding: 2px; border-radius: 10px; background: var(--surface-2); overflow-x: auto; max-width: 100%; scrollbar-width: none }
.filters::-webkit-scrollbar { display: none }
.fchip { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 11px; border-radius: 8px; border: 0; background: none; font-size: 12.5px; font-weight: 600; white-space: nowrap; color: var(--ink-2) }
.fchip[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .08) }
.fcount { min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font: 600 11px/16px var(--f-mono); text-align: center }
.tfilter .fchip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px }
.tfilter .fchip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); box-shadow: none }

/* Layout */
.shell { padding-bottom: 20px }
.col-main, .col-rail { display: grid; gap: 22px; min-width: 0; align-content: start }
.view { display: grid; gap: 14px; min-width: 0; align-content: start }
@media (max-width: 1023.98px) { .view:not(.on) { display: none } .col-rail { margin-top: 0 } }
#banners { display: grid; gap: 10px }
#banners:empty { display: none }
.banner { padding: 12px 16px; border-radius: var(--r-sm); background: var(--warn-soft); color: var(--warn); font-weight: 500 }
.banner.crit { background: var(--crit-soft); color: var(--crit) }
.foot { color: var(--muted); font-size: 12px; text-align: center; margin: 0 auto; padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)) }

/* Hero */
.hero { display: flex; align-items: center; gap: 12px; padding: 2px }
.hero-n { font: 700 32px/1 var(--f-mono); color: var(--accent); font-variant-numeric: tabular-nums; letter-spacing: -.04em; flex: none }
.hero-n.zero { color: var(--ok); font-family: var(--f-body) }
.hero-t { font-size: 17px; font-weight: 700; line-height: 1.3 }
.hero-s { color: var(--muted); font-size: 12.5px; line-height: 1.5 }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); display: grid; gap: 12px; min-width: 0 }
.card > h2 { font-size: 15px }
.dec.gate { border-left: 5px solid var(--gate) }
.dec.system { border-left: 5px solid var(--crit) }
.sys-line { margin-top: 6px }
.sys-line b { font-weight: 600 }
.card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px }
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 650 }
.tag.ask { background: var(--accent-soft); color: var(--accent) }
.tag.gate { background: var(--gate-soft); color: var(--gate) }
.tag.system { background: var(--crit-soft); color: var(--crit) }
.tag.look { background: var(--warn-soft); color: var(--warn) }
.dec.look { border-left: 5px solid var(--warn) }
.self-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.self-actions .btn.ghost, .ok-btn { min-height: 36px }
.self-tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; color: var(--muted); font-size: 12.5px }
.self-body > summary { list-style: none; cursor: pointer }
.self-body > summary::-webkit-details-marker { display: none }
.self-body > summary::before { content: "▸ "; color: var(--muted) }
.self-body[open] > summary::before { content: "▾ " }
.self-body > summary + * { margin-top: 6px }
.self-body .links { margin-top: 8px }
.remind { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 8px 12px; border-radius: var(--r-sm); background: var(--warn-soft); color: var(--warn); font-size: 13px; font-weight: 600 }
.meta { color: var(--muted); font-size: 12px; overflow-wrap: anywhere }
.age { margin-left: auto }
.body { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink-2) }
.links { display: flex; flex-wrap: wrap; gap: 8px }
.pill { display: inline-flex; align-items: center; gap: 5px; min-height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--accent); font-size: 12.5px; font-weight: 600; text-decoration: none; white-space: nowrap }
.pill:hover { border-color: var(--accent) }
.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none }
.pill .ico { width: 15px; height: 15px }

.opts { display: grid; gap: 10px }
@media (min-width: 600px) { .opts { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)) } }
.opt { display: grid; gap: 2px; align-content: start; text-align: left; min-height: 46px; padding: 9px 12px; border-radius: var(--r-sm); border: 1.5px solid var(--line-strong); background: var(--surface) }
.opt:hover:not(:disabled) { border-color: var(--accent) }
.opt.rec { border: 2px solid var(--accent); background: var(--accent-soft) }
.opt-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px }
.opt-label { font-size: 14px; font-weight: 650; line-height: 1.45 }
.rec-tag { flex: none; padding: 0 7px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 11.5px; font-weight: 700; line-height: 18px }
.opt-cost { color: var(--muted); font-size: 12.5px; line-height: 1.5 }
.opt:disabled:not(.chosen) { opacity: .5 }
.opt.chosen { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); opacity: 1 }
.opt.chosen .opt-cost { color: var(--accent-ink); opacity: .85 }
.opt.chosen .rec-tag { background: var(--accent-ink); color: var(--accent) }

.reply { display: flex; gap: 8px }
.reply input { flex: 1 1 auto; min-width: 0; min-height: 40px; padding: 0 12px; border-radius: var(--r-sm); border: 1.5px solid var(--line); background: var(--bg) }
.reply input:focus { border-color: var(--accent); outline: none }
.btn { min-height: 40px; padding: 0 14px; border-radius: var(--r-sm); border: 1.5px solid var(--ink); background: var(--ink); color: var(--bg); font-weight: 650; white-space: nowrap }
.btn:disabled { opacity: .45 }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line-strong) }
.btn.ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent) }
.btn.small { min-height: 30px; padding: 0 10px; font-size: 12.5px; background: var(--surface); color: var(--accent); border-color: var(--accent-line) }
.row .btn.ghost { min-height: 32px; padding: 0 10px; font-size: 12.5px }
.sent { display: grid; gap: 2px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--ok-soft); color: var(--ok); font-size: 13px }
.sent b { font-weight: 650 }
.note { font-size: 12.5px; color: var(--muted) }
.note.ok { color: var(--ok); font-weight: 600 }
.note.warn { color: var(--warn) }
.note.crit { color: var(--crit) }

/* Sections */
.sec { display: grid; gap: 12px; min-width: 0 }
.sec-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px }
.sec-h .hint { color: var(--muted); font-size: 12.5px }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; min-width: 0 }
.list > * + * { border-top: 1px solid var(--line) }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; align-items: center; padding: 12px 16px }
.row > :first-child, .task-main { min-width: 0 }
.row-title { font-weight: 600; overflow-wrap: anywhere }
.row-sub { color: var(--ink-2); font-size: 13px; overflow-wrap: anywhere }
.row-side { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center }
.row > .note { grid-column: 1 / -1 }
details.fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; min-height: 36px; color: var(--ink-2); font-weight: 600; font-size: 13.5px }
details.fold > summary::-webkit-details-marker { display: none }
details.fold > summary::before { content: "▸"; color: var(--muted); transition: transform .15s }
details.fold[open] > summary::before { transform: rotate(90deg) }
details.fold > summary + * { margin-top: 8px }
.check { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; color: var(--ink-2); font-size: 13px; cursor: pointer }
.check input { width: 16px; height: 16px; accent-color: var(--accent) }

/* Chips */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 650; white-space: nowrap; background: var(--accent-soft); color: var(--accent); line-height: 21px }
.chip.ok { background: var(--ok-soft); color: var(--ok) }
.chip.warn { background: var(--warn-soft); color: var(--warn) }
.chip.crit { background: var(--crit-soft); color: var(--crit) }
.chip.gate { background: var(--gate-soft); color: var(--gate) }
.chip.muted { background: var(--surface-2); color: var(--muted) }

/* Tasks */
.tfilter { display: flex; flex-wrap: wrap; gap: 8px }
.task { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; align-items: center; padding: 12px 16px }
.task-title { font-weight: 600; overflow-wrap: anywhere }
.task-title .id { color: var(--muted); font-weight: 500; margin-right: 4px }
.task-meta { color: var(--muted); font-size: 12px; overflow-wrap: anywhere }
.task-side { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center }
@media (max-width: 599.98px) {
  .task, .row { grid-template-columns: minmax(0, 1fr) }
  .task-side, .row-side { justify-content: flex-start }
}
.empty { padding: 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1.5px dashed var(--line-strong); border-radius: var(--r) }

/* Evidence */
.back { justify-self: start }
.verdict { padding: 14px 16px; border-radius: var(--r-sm); background: var(--ok-soft); color: var(--ok); font-weight: 600 }
.crit-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px }
.crit-list li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start }
.crit-list .mark { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-weight: 700 }
.crit-list .mark.ok { background: var(--ok-soft); color: var(--ok) }
.crit-list .mark.crit { background: var(--crit-soft); color: var(--crit) }
.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(180px, 100%), 1fr)); gap: 14px }
.shots figure { margin: 0; display: grid; gap: 6px }
.shots img { width: 100%; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-2) }
.shots figcaption { color: var(--muted); font-size: 12.5px }
/* Logs: one fold each; the text loads when it is opened and scrolls inside its own box. */
.logs { display: grid; gap: 8px; min-width: 0 }
.log { min-width: 0; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg); overflow: hidden }
.log > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: baseline; padding: 9px 12px; font-size: 13px; color: var(--ink-2) }
.log > summary::-webkit-details-marker { display: none }
.log > summary::before { content: "▸"; grid-row: 1 / 3; color: var(--muted); transition: transform .15s }
.log[open] > summary::before { transform: rotate(90deg) }
.log > summary > span { grid-column: 2; min-width: 0; overflow-wrap: anywhere }
.log .log-name { color: var(--muted); font-size: 12px }
.log-text { margin: 0; padding: 10px 12px; border-top: 1px solid var(--line); max-height: 420px; overflow: auto; white-space: pre; font: 12px/1.5 var(--f-mono); color: var(--ink); background: var(--surface-2) }
.rounds { display: flex; align-items: flex-end; gap: 18px; height: 150px; padding-top: 6px; border-bottom: 1px solid var(--line-strong) }
.rcol { display: grid; justify-items: center; align-content: end; gap: 6px; height: 100%; min-width: 48px }
.rcol i { display: block; width: 32px; border-radius: 4px 4px 0 0; background: var(--accent) }
.rval { font-size: 14px; color: var(--ink) }
.rlab { color: var(--muted); font-size: 13px; transform: translateY(26px); white-space: nowrap }
.rounds-wrap { padding-bottom: 28px }

/* Status rail */
/* One compact status panel: each module is a few one-line rows, split by hairlines. */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; font-size: 13px; line-height: 1.5 }
.panel > .ps { padding: 12px 14px; display: grid; gap: 8px; min-width: 0 }
.panel > .ps + .ps { border-top: 1px solid var(--line) }
.ps-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12px; font-weight: 650; color: var(--muted) }
.ps-h .n { font-family: var(--f-mono); font-weight: 500 }
.state-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px }
.state-line .st { font-weight: 700 }
.state-line .st.ok { color: var(--ok) } .state-line .st.warn { color: var(--warn) } .state-line .st.crit { color: var(--crit) }
.state-line .meta, .ps > .meta { font-size: 12px }
/* Usage: label | bar | value | reset, one row each */
.urows { display: grid; grid-template-columns: auto minmax(36px, 1fr) auto auto; gap: 7px 10px; align-items: center }
.ulabel { color: var(--ink-2); white-space: nowrap }
.uval { text-align: right; white-space: nowrap; font-size: 12.5px }
.uval.warn { color: var(--warn) } .uval.crit { color: var(--crit) }
.ureset { color: var(--muted); font-size: 11.5px; white-space: nowrap; text-align: right }
.meter { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden }
.meter > i { display: block; height: 100%; border-radius: 3px; background: var(--accent) }
.meter.warn > i { background: var(--warn) }
.meter.crit > i { background: var(--crit) }
/* Workers: one line, tap to see the session name for `claude attach` */
.wlist { display: grid; gap: 2px }
.wlist details > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; min-height: 32px }
.wlist details > summary::-webkit-details-marker { display: none }
.wlist .chip { font-size: 11.5px; line-height: 19px; padding: 0 7px }
.wlist .wt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.wlist .wt .ap { color: var(--muted); margin-left: 6px; font-size: 12px }
.wlist .wtime { color: var(--muted); font-size: 12px; white-space: nowrap }
.wlist .attach { margin: 2px 0 6px; padding: 6px 8px; border-radius: 8px; background: var(--surface-2); font-size: 11.5px; overflow-wrap: anywhere }
/* Progress: name | bar | done/total, then one muted line */
.prows { display: grid; grid-template-columns: auto minmax(36px, 1fr) auto; gap: 4px 10px; align-items: center }
.prows .pn { font-family: var(--f-mono); font-size: 12.5px }
.prows .pv { font-family: var(--f-mono); font-size: 12.5px; text-align: right }
.prows .pm { grid-column: 1 / -1; color: var(--muted); font-size: 12px; margin-bottom: 4px }
.report { font-size: 13px; line-height: 1.55; padding: 12px 14px; gap: 6px }
.report h4 { margin: 0; font-size: 12px; color: var(--muted); font-weight: 650 }
.report ul { margin: 2px 0 0; padding-left: 18px; display: grid; gap: 2px }
.report .part { display: grid; gap: 0 }
.report.older { box-shadow: none }
.sec > h2.small-h { font-size: 13.5px }

/* Bottom tab bar (phone) */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; box-shadow: 0 -4px 16px rgba(0, 0, 0, .04) }
.tabbar button { position: relative; display: grid; justify-items: center; align-content: center; gap: 0; min-height: 48px; border: 0; border-radius: 10px; background: none; color: var(--muted); font-size: 11.5px; font-weight: 600; line-height: 1.4 }
.tabbar button .ico { width: 22px; height: 22px }
.tabbar button[aria-selected="true"] { color: var(--accent); background: var(--accent-soft) }
.tabbar .tmark { position: absolute; top: 5px; left: calc(50% + 8px); font-size: 11px; line-height: 1 }
.tabbar .tmark.warn { color: var(--warn) } .tabbar .tmark.crit { color: var(--crit) }
