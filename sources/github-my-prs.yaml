# Your own open PRs, read with gh (no AI, no tokens), keyed on <owner>/<repo>#<number>.
source: github-my-prs
brings: messages
read:
  via: command
  run: gh search prs --author=@me --state=open --json number,title,url,author,createdAt,repository
  every: 5m
fill: paths
form:
  id: .number
  at: .createdAt
  text: .title
  author: .author.login
  place: .repository.nameWithOwner
link: .url
key: "{place}#{id}"
sort: { all: pr-review }
